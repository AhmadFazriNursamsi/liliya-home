name: Build BUDI Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BUDI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/budi-release.jks"
            echo "BUDI_KEYSTORE_PATH=$RUNNER_TEMP/budi-release.jks" >> "$GITHUB_ENV"
          else
            echo "::error::Secret BUDI_KEYSTORE_BASE64 belum diisi. Lihat docs/APK_CCTV.md bagian 'Kunci tanda tangan APK'."
            exit 1
          fi

      - name: Build release APK
        working-directory: android
        env:
          BUDI_KEYSTORE_PASSWORD: ${{ secrets.BUDI_KEYSTORE_PASSWORD }}
          BUDI_KEY_ALIAS: ${{ secrets.BUDI_KEY_ALIAS }}
          BUDI_KEY_PASSWORD: ${{ secrets.BUDI_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/BUDI-v1.0.${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BUDI-v1.0.${{ github.run_number }}
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: BUDI Android v1.0.${{ github.run_number }}
          body: |
            APK BUDI Smart Home (asisten, saklar lampu manual & CCTV).
            Unduh file `.apk` di bawah lalu pasang di HP Android.
          files: dist/*.apk
          make_latest: true
