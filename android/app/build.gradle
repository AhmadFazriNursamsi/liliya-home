plugins {
    id 'com.android.application'
}

// Notifikasi FCM butuh app/google-services.json (dari Firebase Console, diisi CI lewat secret
// GOOGLE_SERVICES_JSON_BASE64). Tanpa file itu APK tetap bisa dibangun, hanya tanpa notifikasi.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
def keystorePath = System.getenv('BUDI_KEYSTORE_PATH')

android {
    namespace 'id.laravelia.budi'
    compileSdk 35

    defaultConfig {
        applicationId 'id.laravelia.budi'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('BUDI_KEYSTORE_PASSWORD')
                keyAlias System.getenv('BUDI_KEY_ALIAS')
                keyPassword System.getenv('BUDI_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
