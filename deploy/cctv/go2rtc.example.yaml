# go2rtc untuk BUDI CCTV — hanya listen di localhost, diakses lewat BUDI (port 8080) yang sudah ber-login.
api:
  listen: "127.0.0.1:1984"
rtsp:
  listen: "127.0.0.1:8554"
webrtc:
  listen: ""
srtp:
  listen: ""
log:
  level: warn
streams:
  cam1:
    - rtsp://USER:PASSWORD@192.168.1.4:554/stream1
  cam1_sd:
    - rtsp://USER:PASSWORD@192.168.1.4:554/stream2
    - "ffmpeg:cam1_sd#audio=aac"
