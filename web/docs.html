<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FBF6EE">
<title>Dokumen · Liliya</title>
<link rel="icon" type="image/png" href="/static/img/logo-192.png">
<link rel="stylesheet" href="/static/vendor/pdfjs/web/pdf_viewer.css">
<link rel="modulepreload" href="/static/vendor/pdfjs/build/pdf.min.mjs">
<link rel="modulepreload" href="/static/vendor/pdfjs/web/pdf_viewer.mjs">
<style>
:root {
    --bg: #EFE6DA;
    --surface: #FFFFFF;
    --border: #F0E3D3;
    --text: #3A241C;
    --muted: #85665A;
    --peach: #FFB88E;
    --peach-soft: #FFE8D9;
    --brown: #3A241C;
    --red: #D64545;
    --bar-h: 56px;
    --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Bar atas */
.bar {
    position: fixed; inset: 0 0 auto; z-index: 30; height: calc(var(--bar-h) + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 6px 0; display: flex; align-items: center; gap: 4px;
    background: rgba(251, 246, 238, 0.94); border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.icon-btn { width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: var(--text); display: grid; place-items: center; cursor: pointer; text-decoration: none; }
.icon-btn:active { background: rgba(58, 36, 28, .08); }
.icon-btn[hidden] { display: none; }
.title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.title strong { display: block; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.title small { display: block; font-size: .74rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.title > div { min-width: 0; }
.badge { flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: .62rem; font-weight: 800; letter-spacing: .02em; color: #fff; background: #8C8C8C; }
.badge.word { background: #2B5797; } .badge.sheet { background: #1E7145; } .badge.slides { background: #D04423; } .badge.pdf { background: #C9302C; }

/* Bar pencarian */
.search {
    position: fixed; left: 0; right: 0; top: calc(var(--bar-h) + env(safe-area-inset-top)); z-index: 29;
    display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 12px;
    background: var(--surface); border-bottom: 1px solid var(--border); box-shadow: 0 6px 16px rgba(58,36,28,.06);
}
.search[hidden] { display: none; }
body.searching #viewerContainer { top: calc(var(--bar-h) + 53px + env(safe-area-inset-top)); }
.search input { flex: 1; min-width: 0; height: 40px; padding: 0 12px; border: 1.5px solid var(--border); border-radius: 12px; background: #FFF8F0; font: inherit; color: var(--text); outline: none; }
.search input:focus { border-color: var(--peach); }
.search .count { font-size: .78rem; color: var(--muted); min-width: 52px; text-align: center; }

/* Penampil pdf.js (container wajib position: absolute) */
#viewerContainer { position: absolute; inset: calc(var(--bar-h) + env(safe-area-inset-top)) 0 0; overflow: auto; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; }
#viewerContainer[hidden] { display: none; }
.pdfViewer { padding: 10px 0 96px; }
.pdfViewer .page { margin: 0 auto 10px; border: 0; border-radius: 4px; box-shadow: 0 1px 3px rgba(58,36,28,.12), 0 8px 24px rgba(58,36,28,.10); }
.pdfViewer .page .loadingIcon::after { display: none; }

/* Kontrol bawah */
.controls {
    position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 30; transform: translateX(-50%);
    display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px;
    background: rgba(58, 36, 28, .88); color: #FFF4EA; box-shadow: 0 10px 28px rgba(58,36,28,.3);
    transition: opacity .25s, transform .25s;
}
.controls[hidden] { display: none; }
.controls.away { opacity: 0; transform: translate(-50%, 12px); pointer-events: none; }
.controls .icon-btn { width: 40px; height: 40px; border-radius: 999px; }
.controls .icon-btn:active { background: rgba(255,255,255,.14); }
.controls svg { width: 20px; height: 20px; }
.pages { min-width: 64px; padding: 0 8px; text-align: center; font-size: .82rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.sep { width: 1px; height: 20px; background: rgba(255,255,255,.2); margin: 0 2px; }

/* Status: menyiapkan / error / kata sandi */
.state { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 96px 24px 24px; text-align: center; background: var(--bg); }
.state[hidden] { display: none; }
.state-card { width: min(380px, 100%); padding: 28px 24px; border-radius: 22px; background: var(--surface); box-shadow: 0 1px 2px rgba(58,36,28,.04), 0 12px 32px rgba(58,36,28,.08); }
.state-card h1 { margin: 16px 0 6px; font-size: 1.1rem; }
.state-card p { margin: 0; color: var(--muted); font-size: .88rem; }
.state-card .elapsed { margin-top: 10px; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.spinner { width: 54px; height: 54px; margin: 0 auto; border-radius: 50%; border: 4px solid var(--peach-soft); border-top-color: var(--peach); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.state-icon { width: 56px; height: 56px; margin: 0 auto; border-radius: 18px; display: grid; place-items: center; background: #FBE4E1; color: var(--red); }
.state-icon.lock { background: var(--peach-soft); color: var(--brown); }
.bar-progress { height: 6px; margin-top: 16px; border-radius: 99px; background: var(--peach-soft); overflow: hidden; }
.bar-progress span { display: block; height: 100%; width: 0; background: var(--peach); border-radius: inherit; transition: width .2s; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid #E3CDB6; background: var(--surface); font-weight: 600; font-size: .88rem; text-decoration: none; cursor: pointer; }
.btn.primary { background: var(--peach); border-color: var(--peach); }
.btn svg { width: 18px; height: 18px; }
.pw { display: flex; gap: 8px; margin-top: 16px; }
.pw input { flex: 1; min-width: 0; height: 42px; padding: 0 12px; border: 1.5px solid var(--border); border-radius: 12px; font: inherit; }

.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 40; transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 12px; background: var(--brown); color: #FFF4EA; font-size: .85rem; }
.toast[hidden] { display: none; }
</style>
</head>
<body>

<header class="bar" id="bar">
    <button class="icon-btn" id="btn-back" aria-label="Kembali"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="title">
        <span class="badge" id="badge">DOC</span>
        <div><strong id="doc-name">Memuat dokumen…</strong><small id="doc-meta"></small></div>
    </div>
    <button class="icon-btn" id="btn-search" aria-label="Cari teks" hidden><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    <a class="icon-btn" id="btn-download" aria-label="Unduh file asli" hidden><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></a>
</header>

<div class="search" id="search" hidden>
    <input id="search-input" type="search" placeholder="Cari di dokumen" enterkeyhint="search" autocomplete="off">
    <span class="count" id="search-count"></span>
    <button class="icon-btn" id="search-prev" aria-label="Sebelumnya"><svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></button>
    <button class="icon-btn" id="search-next" aria-label="Berikutnya"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="icon-btn" id="search-close" aria-label="Tutup pencarian"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<div id="viewerContainer" hidden><div id="viewer" class="pdfViewer"></div></div>

<div class="controls" id="controls" hidden>
    <button class="icon-btn" id="zoom-out" aria-label="Perkecil"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button class="icon-btn" id="zoom-fit" aria-label="Pas lebar layar"><svg viewBox="0 0 24 24"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></svg></button>
    <button class="icon-btn" id="zoom-in" aria-label="Perbesar"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <span class="sep"></span>
    <span class="pages" id="pages">– / –</span>
</div>

<div class="state" id="state">
    <div class="state-card" id="state-card"><div class="spinner"></div><h1>Membuka dokumen…</h1><p>Sebentar ya.</p></div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script type="module">
const $ = s => document.querySelector(s);
const docId = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
const KIND_LABEL = { word: 'Dokumen Word', sheet: 'Lembar kerja', slides: 'Presentasi', pdf: 'PDF' };
const state = $('#state'), card = $('#state-card'), container = $('#viewerContainer');
let meta = null, pdfViewer = null, eventBus = null, waitStarted = Date.now();

// ---------- Utilitas ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function fmtSize(b) { return b >= 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600); }
const ICON = {
    error: '<div class="state-icon"><svg viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.01"/><circle cx="12" cy="12" r="9"/></svg></div>',
    lock: '<div class="state-icon lock"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>',
    download: '<svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
    retry: '<svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>'
};
function showState(html) { card.innerHTML = html; state.hidden = false; }
function originalLink(label = 'Unduh file asli') { return `<a class="btn" href="/api/docs/${encodeURIComponent(docId)}/original">${ICON.download}${label}</a>`; }

async function api(path, opts) {
    const res = await fetch(path, { credentials: 'same-origin', cache: 'no-store', ...opts });
    if (res.status === 401) { location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search); throw new Error('login'); }
    let body = {};
    try { body = await res.json(); } catch (e) {}
    if (!res.ok) throw Object.assign(new Error(body.error || `Server error ${res.status}`), { status: res.status });
    return body;
}

// ---------- Kembali / tutup ----------
$('#btn-back').addEventListener('click', () => {
    if (window.LiliyaDoc) LiliyaDoc.close();
    else if (history.length > 1 && document.referrer.startsWith(location.origin)) history.back();
    else location.href = '/#docs';
});

// ---------- Menunggu konversi di server ----------
function renderMeta() {
    document.title = `${meta.name} · Liliya`;
    $('#doc-name').textContent = meta.name;
    $('#doc-meta').textContent = `${KIND_LABEL[meta.kind] || 'Dokumen'} · ${fmtSize(meta.size)}`;
    const badge = $('#badge');
    badge.className = 'badge ' + meta.kind;
    badge.textContent = meta.ext.toUpperCase().slice(0, 4);
    const dl = $('#btn-download');
    dl.href = `/api/docs/${encodeURIComponent(docId)}/original`;
    dl.hidden = false;
}

function showConverting() {
    const secs = Math.round((Date.now() - waitStarted) / 1000);
    if (!card.querySelector('.elapsed')) {
        showState(`<div class="spinner"></div><h1>Menyiapkan dokumen…</h1>
            <p>Dokumen Office sedang diubah di server rumah supaya tampil rapi seperti aslinya. Biasanya 5–40 detik.</p>
            <div class="elapsed"></div>`);
    }
    card.querySelector('.elapsed').textContent = secs >= 3 ? `${secs} detik` : '';
}

function showError(msg, retry) {
    showState(`${ICON.error}<h1>Dokumen belum bisa dibuka</h1><p>${esc(msg)}</p>
        <div class="actions">${retry ? `<button class="btn primary" id="btn-retry">${ICON.retry}Coba lagi</button>` : ''}${meta ? originalLink() : ''}</div>`);
    const r = $('#btn-retry');
    if (r) r.addEventListener('click', async () => {
        waitStarted = Date.now();
        try { await api(`/api/docs/${encodeURIComponent(docId)}/retry`, { method: 'POST' }); } catch (e) {}
        poll();
    });
}

async function poll() {
    try {
        meta = await api(`/api/docs/${encodeURIComponent(docId)}`);
    } catch (e) {
        if (e.message === 'login') return;
        if (e.status === 404) return showError(e.message, false);
        showState(`${ICON.error}<h1>Server tidak terjangkau</h1><p>${esc(e.message)}. Mencoba lagi…</p>`);
        return setTimeout(poll, 3000);
    }
    renderMeta();
    if (meta.status === 'ready') return openPdf();
    if (meta.status === 'error') return showError(meta.error || 'Konversi gagal.', true);
    showConverting();
    setTimeout(poll, 1200);
}

// ---------- pdf.js ----------
let pdfjsLib, viewerMod;
async function loadPdfjs() {
    pdfjsLib = await import('/static/vendor/pdfjs/build/pdf.min.mjs');
    globalThis.pdfjsLib = pdfjsLib;          // pdf_viewer.mjs membaca pustaka dari global
    viewerMod = await import('/static/vendor/pdfjs/web/pdf_viewer.mjs');
    pdfjsLib.GlobalWorkerOptions.workerSrc = '/static/vendor/pdfjs/build/pdf.worker.min.mjs';
}
const pdfjsReady = loadPdfjs();

async function openPdf(password) {
    if (!card.querySelector('.bar-progress')) {
        showState(`<div class="spinner"></div><h1>Memuat dokumen…</h1><p>${esc(meta.name)}</p><div class="bar-progress"><span></span></div>`);
    }
    await pdfjsReady;
    const task = pdfjsLib.getDocument({
        url: `/api/docs/${encodeURIComponent(docId)}/pdf`,
        withCredentials: true,
        password,
        cMapUrl: '/static/vendor/pdfjs/cmaps/',
        cMapPacked: true,
        standardFontDataUrl: '/static/vendor/pdfjs/standard_fonts/',
    });
    task.onProgress = ({ loaded, total }) => {
        const bar = card.querySelector('.bar-progress span');
        if (bar && total) bar.style.width = Math.min(100, loaded / total * 100) + '%';
    };
    let pdf;
    try {
        pdf = await task.promise;
    } catch (e) {
        if (e.name === 'PasswordException') return askPassword(e.code === pdfjsLib.PasswordResponses.INCORRECT_PASSWORD);
        return showError('PDF tidak bisa dibaca. ' + (e.message || ''), false);
    }
    setupViewer(pdf);
}

function askPassword(wrong) {
    showState(`${ICON.lock}<h1>Dokumen dikunci kata sandi</h1><p>${wrong ? 'Kata sandi salah, coba lagi.' : 'Masukkan kata sandi untuk membuka dokumen ini.'}</p>
        <form class="pw" id="pw-form"><input type="password" id="pw" autocomplete="off" placeholder="Kata sandi" required><button class="btn primary">Buka</button></form>
        <div class="actions">${originalLink()}</div>`);
    const input = $('#pw');
    input.focus();
    $('#pw-form').addEventListener('submit', e => { e.preventDefault(); card.innerHTML = ''; openPdf(input.value); });
}

function setupViewer(pdf) {
    const { EventBus, PDFViewer, PDFLinkService, PDFFindController, LinkTarget } = viewerMod;
    eventBus = new EventBus();
    const linkService = new PDFLinkService({ eventBus, externalLinkTarget: LinkTarget.BLANK, externalLinkRel: 'noopener noreferrer' });
    const findController = new PDFFindController({ eventBus, linkService });
    container.hidden = false;
    pdfViewer = new PDFViewer({
        container, viewer: $('#viewer'), eventBus, linkService, findController,
        textLayerMode: 1, annotationMode: pdfjsLib.AnnotationMode.ENABLE, maxCanvasPixels: 2 ** 24,
    });
    linkService.setViewer(pdfViewer);

    eventBus.on('pagesinit', () => {
        pdfViewer.currentScaleValue = (meta.kind === 'slides' && innerWidth > innerHeight) ? 'page-fit' : 'page-width';
        state.hidden = true;
        $('#controls').hidden = false;
        $('#btn-search').hidden = false;
    });
    eventBus.on('pagechanging', ({ pageNumber }) => { $('#pages').textContent = `${pageNumber} / ${pdf.numPages}`; });
    eventBus.on('updatefindmatchescount', ({ matchesCount }) => showMatches(matchesCount));
    eventBus.on('updatefindcontrolstate', ({ state: s, matchesCount }) => {
        if (s === 1) $('#search-count').textContent = 'Tidak ada';    // FindState.NOT_FOUND
        else showMatches(matchesCount);
    });
    pdfViewer.setDocument(pdf);
    linkService.setDocument(pdf, null);
    $('#pages').textContent = `1 / ${pdf.numPages}`;
    if (meta.kind === 'sheet') toast('Setiap sheet ditampilkan sebagai satu halaman. Cubit untuk memperbesar.');
}

// ---------- Zoom: tombol, cubit, ketuk dua kali, Ctrl+gulir ----------
const MIN_SCALE = 0.25, MAX_SCALE = 8;
function zoomBy(factor, origin) {
    if (!pdfViewer) return;
    const target = Math.min(MAX_SCALE, Math.max(MIN_SCALE, pdfViewer.currentScale * factor));
    pdfViewer.updateScale({ scaleFactor: target / pdfViewer.currentScale, origin, drawingDelay: 250 });
}
$('#zoom-in').addEventListener('click', () => zoomBy(1.25));
$('#zoom-out').addEventListener('click', () => zoomBy(0.8));
$('#zoom-fit').addEventListener('click', () => { if (pdfViewer) pdfViewer.currentScaleValue = 'page-width'; });

let pinch = null;
const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
container.addEventListener('touchstart', e => {
    if (e.touches.length === 2) pinch = { d: dist(e.touches) };
}, { passive: true });
container.addEventListener('touchmove', e => {
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    const d = dist(e.touches);
    const factor = d / pinch.d;
    if (Math.abs(factor - 1) < 0.02) return;
    pinch.d = d;
    zoomBy(factor, [(e.touches[0].clientX + e.touches[1].clientX) / 2, (e.touches[0].clientY + e.touches[1].clientY) / 2]);
}, { passive: false });
container.addEventListener('touchend', e => { if (e.touches.length < 2) pinch = null; });

let lastTap = 0;
container.addEventListener('touchend', e => {
    if (e.touches.length || e.changedTouches.length !== 1 || !pdfViewer) return;
    const now = Date.now(), t = e.changedTouches[0];
    if (now - lastTap < 280) {
        e.preventDefault();
        const fitScale = pdfViewer.currentScale;
        pdfViewer.currentScaleValue = 'page-width';
        if (Math.abs(pdfViewer.currentScale - fitScale) < 0.05) zoomBy(2, [t.clientX, t.clientY]);
        lastTap = 0;
    } else lastTap = now;
});
container.addEventListener('wheel', e => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    zoomBy(e.deltaY < 0 ? 1.1 : 0.9, [e.clientX, e.clientY]);
}, { passive: false });

// ---------- Sembunyikan kontrol zoom saat menggulir ke bawah, munculkan lagi saat ke atas ----------
let lastY = 0;
container.addEventListener('scroll', () => {
    const y = container.scrollTop;
    if (y > lastY + 6 && y > 80) $('#controls').classList.add('away');
    else if (y < lastY - 6) $('#controls').classList.remove('away');
    lastY = y;
}, { passive: true });

// ---------- Pencarian ----------
function showMatches(m) { $('#search-count').textContent = m && m.total ? `${m.current} / ${m.total}` : ($('#search-input').value ? 'Tidak ada' : ''); }
function find(type, findPrevious = false) {
    const query = $('#search-input').value.trim();
    if (!eventBus || !query) { $('#search-count').textContent = ''; return; }
    eventBus.dispatch('find', { source: null, type, query, caseSensitive: false, entireWord: false,
        highlightAll: true, findPrevious, matchDiacritics: false });
}
$('#btn-search').addEventListener('click', () => {
    const box = $('#search');
    box.hidden = !box.hidden;
    document.body.classList.toggle('searching', !box.hidden);
    if (!box.hidden) $('#search-input').focus();
});
let findTimer;
$('#search-input').addEventListener('input', () => { clearTimeout(findTimer); findTimer = setTimeout(() => find(''), 250); });
$('#search-input').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); find('again', e.shiftKey); } });
$('#search-next').addEventListener('click', () => find('again'));
$('#search-prev').addEventListener('click', () => find('again', true));
$('#search-close').addEventListener('click', () => {
    $('#search').hidden = true;
    document.body.classList.remove('searching');
    $('#search-input').value = '';
    if (eventBus) eventBus.dispatch('findbarclose', { source: null });
});

if (!docId) showError('Alamat dokumen tidak lengkap.', false);
else poll();
</script>
</body>
</html>
