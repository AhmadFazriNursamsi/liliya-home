<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#090d16">
    <title>Masuk — BUDI</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #090d16; --card: rgba(18, 24, 38, 0.82); --border: rgba(255, 255, 255, 0.08); --accent: #00d2ff; --text: #f8fafc; --muted: #94a3b8; --red: #ff4757; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            background: radial-gradient(circle at 20% 10%, rgba(0, 210, 255, 0.12), transparent 45%),
                        radial-gradient(circle at 80% 90%, rgba(157, 78, 221, 0.14), transparent 45%), var(--bg);
            color: var(--text); font-family: 'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;
            display: flex; align-items: center; justify-content: center;
            padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        }
        .card { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 32px 24px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); text-align: center; }
        .logo { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center; font-size: 1.6rem; color: #000; background: linear-gradient(135deg, #00f2fe, #4facfe); box-shadow: 0 0 32px rgba(0, 210, 255, 0.35); }
        h1 { font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 700; }
        p.sub { color: var(--muted); font-size: 0.88rem; margin: 6px 0 24px; }
        label { display: block; text-align: left; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
        .field { position: relative; }
        input[type=password], input[type=text] { width: 100%; padding: 13px 44px 13px 14px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255, 255, 255, 0.04); color: var(--text); font-size: 1rem; font-family: inherit; outline: none; }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 210, 255, 0.15); }
        .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: 0; color: var(--muted); width: 36px; height: 36px; cursor: pointer; font-size: 1rem; }
        button.submit { width: 100%; margin-top: 18px; padding: 13px; border: 0; border-radius: 12px; font-weight: 700; font-size: 1rem; font-family: 'Outfit', sans-serif; cursor: pointer; color: #000; background: linear-gradient(135deg, #00f2fe, #4facfe); }
        .error { margin-top: 14px; font-size: 0.85rem; color: var(--red); min-height: 1.2em; }
    </style>
</head>
<body>
    <form class="card" method="post" action="/login">
        <div class="logo"><i class="fa-solid fa-house-signal"></i></div>
        <h1>BUDI Smart Home</h1>
        <p class="sub">Masukkan password untuk mengakses asisten, saklar & CCTV.</p>
        <label for="password">Password</label>
        <div class="field">
            <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
            <button type="button" class="eye" id="eye" aria-label="Tampilkan password"><i class="fa-solid fa-eye"></i></button>
        </div>
        <input type="hidden" name="next" id="next" value="/">
        <button type="submit" class="submit">Masuk</button>
        <div class="error" id="error"></div>
    </form>
    <script>
        const q = new URLSearchParams(location.search);
        document.getElementById('next').value = q.get('next') || '/';
        const err = q.get('error');
        if (err) {
            document.getElementById('error').textContent = err === 'locked'
                ? 'Terlalu banyak percobaan. Coba lagi 10 menit lagi.'
                : 'Password salah.';
        }
        const pw = document.getElementById('password');
        document.getElementById('eye').addEventListener('click', (e) => {
            pw.type = pw.type === 'password' ? 'text' : 'password';
            e.currentTarget.innerHTML = pw.type === 'password' ? '<i class="fa-solid fa-eye"></i>' : '<i class="fa-solid fa-eye-slash"></i>';
        });
    </script>
</body>
</html>
