<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FBF6EE">
    <title>Masuk — Liliya</title>
    <link rel="icon" type="image/png" href="/static/img/logo-192.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #FBF6EE; --surface: #FFFFFF; --border: #E3CDB6; --peach: #FFB88E; --peach-strong: #F7996A; --brown: #3A241C; --muted: #85665A; --red: #A92F2F; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            background: var(--bg);
            color: var(--brown);
            font-family: 'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        }
        .card { width: 100%; max-width: 360px; text-align: center; }
        .logo { width: 112px; height: 112px; border-radius: 50%; object-fit: cover; margin-bottom: 16px; box-shadow: 0 10px 30px rgba(58, 36, 28, 0.12); }
        h1 { font-family: 'Fraunces', Georgia, serif; font-size: 2rem; font-weight: 700; }
        p.sub { color: var(--muted); font-size: 0.92rem; margin: 6px 0 28px; }
        label { display: block; text-align: left; font-size: 0.82rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
        .field { position: relative; }
        input[type=password], input[type=text] {
            width: 100%; padding: 14px 48px 14px 16px; border-radius: 14px; border: 1px solid var(--border);
            background: var(--surface); color: var(--brown); font-size: 1rem; font-family: inherit; outline: none;
        }
        input:focus { border-color: var(--peach-strong); box-shadow: 0 0 0 3px rgba(247, 153, 106, 0.2); }
        .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1rem; }
        button.submit {
            width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 14px; cursor: pointer;
            background: var(--brown); color: #FFF8F0; font-family: inherit; font-size: 1rem; font-weight: 700;
        }
        button.submit:active { transform: scale(0.98); }
        .error { margin-top: 14px; min-height: 1.2em; font-size: 0.86rem; color: var(--red); }
    </style>
</head>
<body>
    <form class="card" method="post" action="/login">
        <img src="/static/img/logo-192.png" alt="Logo Liliya" class="logo" width="112" height="112">
        <h1>Liliya</h1>
        <p class="sub">Masuk untuk mengakses asisten, rumah & CCTV.</p>
        <label for="password">Password</label>
        <div class="field">
            <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
            <button type="button" class="eye" id="eye" aria-label="Tampilkan password"><i class="fa-solid fa-eye"></i></button>
        </div>
        <input type="hidden" name="next" id="next" value="/">
        <button type="submit" class="submit">Masuk</button>
        <div class="error" id="error" role="alert"></div>
    </form>
    <script>
        const q = new URLSearchParams(location.search);
        document.getElementById('next').value = q.get('next') || '/';
        const err = q.get('error');
        if (err) {
            document.getElementById('error').textContent = err === 'locked'
                ? 'Terlalu banyak percobaan. Coba lagi 10 menit lagi.'
                : 'Password salah.';
        }
        const pw = document.getElementById('password');
        document.getElementById('eye').addEventListener('click', (e) => {
            pw.type = pw.type === 'password' ? 'text' : 'password';
            e.currentTarget.innerHTML = pw.type === 'password' ? '<i class="fa-solid fa-eye"></i>' : '<i class="fa-solid fa-eye-slash"></i>';
        });
    </script>
</body>
</html>
