services:
  stb-assistant:
    # Image dibangun otomatis oleh GitHub Actions (docker-publish.yml) dari repo liliya-home
    image: ghcr.io/${GHCR_USERNAME:-ahmadfazrinursamsi}/liliya-home:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: budi-smart-assistant
    restart: unless-stopped
    network_mode: host # Rekomendasi di STB Linux/Armbian untuk WebUI & mDNS instan
    devices:
      - "/dev/snd:/dev/snd" # Akses langsung mikrofon & speaker hardware STB
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./sounds:/app/sounds
    environment:
      - TZ=Asia/Jakarta
      - PYTHONUNBUFFERED=1
    group_add:
      - audio
